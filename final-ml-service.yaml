apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: final-ml-service
  namespace: infra-tools
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: application
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://gitlab.com/nick-ops/MLOps.git
    targetRevision: final-project
    path: final-ml-service/helm
    helm:
      releaseName: final-ml-service
      valuesObject:
        env:
          retrainWebhookUrl: ""
          gitlabTriggerUrl: "https://gitlab.com/api/v4/projects/83068665/trigger/pipeline"
          gitlabTriggerRef: "final-project"
        secret:
          create: false
          name: "final-ml-service-secret"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
